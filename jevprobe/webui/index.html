<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jev Playground · TypeSafe System One</title>
<style>
/* ============================== 设计令牌 ============================== */
:root{
  --bg:#020617; --bg-grad:#0b1220;
  --card:#0e1223; --card-2:#131829; --sunk:#0a0e1c;
  --border:rgba(148,163,184,.18); --border-str:rgba(148,163,184,.32);
  --fg:#f8fafc; --fg-dim:#a5b3c9; --fg-mute:#6b7a91;
  --accent:#22c55e; --accent-soft:rgba(34,197,94,.14); --accent-line:rgba(34,197,94,.45);
  --danger:#ef4444; --danger-soft:rgba(239,68,68,.14);
  --warn:#f59e0b; --warn-soft:rgba(245,158,11,.14);
  --info:#38bdf8; --info-soft:rgba(56,189,248,.13);
  --violet:#818cf8;
  --radius:16px; --radius-sm:10px;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
html[data-theme="light"]{
  --bg:#f4f6fb; --bg-grad:#e9edf7;
  --card:#ffffff; --card-2:#f7f9fd; --sunk:#eef2f9;
  --border:rgba(15,23,42,.12); --border-str:rgba(15,23,42,.24);
  --fg:#0b1220; --fg-dim:#44536b; --fg-mute:#7c8aa3;
  --accent:#16a34a; --accent-soft:rgba(22,163,74,.12); --accent-line:rgba(22,163,74,.4);
  --danger:#dc2626; --danger-soft:rgba(220,38,38,.1);
  --warn:#b45309; --warn-soft:rgba(180,83,9,.1);
  --info:#0284c7; --info-soft:rgba(2,132,199,.1);
  --violet:#6366f1;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--sans); color:var(--fg); font-size:14px; line-height:1.6;
  background:
    radial-gradient(1100px 620px at 88% -12%, rgba(34,197,94,.10), transparent 62%),
    radial-gradient(900px 560px at 4% 0%, rgba(129,140,248,.10), transparent 60%),
    linear-gradient(180deg, var(--bg-grad), var(--bg) 46%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:var(--mono); font-variant-ligatures:none}

/* ============================== 顶栏 ============================== */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:14px 22px;
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:baseline; gap:10px; min-width:0}
.brand h1{font-size:16px; font-weight:600; margin:0; letter-spacing:-.01em; white-space:nowrap}
.brand .sub{font-family:var(--mono); font-size:11px; color:var(--fg-mute); white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft); flex:none; align-self:center}
.top-right{display:flex; align-items:center; gap:10px}

.pill{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:11px; padding:4px 10px; border-radius:999px;
  border:1px solid var(--border); color:var(--fg-dim); background:var(--card);
  white-space:nowrap;
}
.pill.ok{border-color:var(--accent-line); color:var(--accent); background:var(--accent-soft)}
.pill.bad{border-color:var(--danger); color:var(--danger); background:var(--danger-soft)}

.banner{
  margin:12px 22px 0; padding:10px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--warn); background:var(--warn-soft); color:var(--fg);
  font-size:13px; display:flex; gap:10px; align-items:flex-start;
}
.banner code{font-family:var(--mono); font-size:12px; background:rgba(0,0,0,.22); padding:1px 5px; border-radius:5px}
.hidden{display:none !important}

/* ============================== 布局 ============================== */
main{
  display:grid; grid-template-columns:minmax(380px, 42fr) minmax(420px, 58fr);
  gap:18px; padding:18px 22px 40px; align-items:start;
}
@media (max-width:1080px){ main{grid-template-columns:1fr} }

.panel{
  background:color-mix(in srgb, var(--card) 92%, transparent);
  border:1px solid var(--border); border-radius:var(--radius);
  padding:18px;
}
.builder{position:sticky; top:76px; max-height:calc(100vh - 96px); overflow:auto}
@media (max-width:1080px){ .builder{position:static; max-height:none} }
.builder::-webkit-scrollbar{width:10px}
.builder::-webkit-scrollbar-thumb{background:var(--border-str); border-radius:8px}

fieldset{border:0; margin:0 0 20px; padding:0}
fieldset:last-of-type{margin-bottom:8px}
legend{
  display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  font-size:13px; font-weight:600; color:var(--fg); padding:0 0 9px;
}
.hint{font-weight:400; font-size:11.5px; color:var(--fg-mute)}

/* ============================== 控件 ============================== */
.input{
  width:100%; padding:9px 11px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--sunk); color:var(--fg);
  font-family:var(--sans); font-size:13px; outline:none;
  transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.input:focus-visible{border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft)}
.input.mono{font-family:var(--mono); font-size:12.5px; line-height:1.65}
textarea.input{resize:vertical; min-height:70px}
select.input{cursor:pointer; appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--fg-mute) 50%),linear-gradient(135deg,var(--fg-mute) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%, calc(100% - 11px) 50%;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:32px}
.input.sm{padding:6px 9px; font-size:12px}

button{font-family:inherit; cursor:pointer}
.primary{
  display:inline-flex; align-items:center; gap:8px;
  padding:10px 18px; border-radius:var(--radius-sm); border:1px solid transparent;
  background:var(--accent); color:#04250f; font-weight:600; font-size:13.5px;
  box-shadow:0 6px 22px -10px var(--accent); transition:transform .12s var(--ease), filter .15s;
}
.primary:hover{filter:brightness(1.06)}
.primary:active{transform:scale(.985)}
.primary:disabled{opacity:.5; cursor:not-allowed; box-shadow:none}
.ghost{
  padding:7px 12px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--card-2); color:var(--fg-dim);
  font-size:12.5px; transition:border-color .15s, color .15s;
}
.ghost:hover{border-color:var(--border-str); color:var(--fg)}
.ghost.sm{padding:5px 10px; font-size:12px}
.ghost.icon{padding:5px 8px; font-size:13px; line-height:1}
kbd{font-family:var(--mono); font-size:10.5px; background:rgba(0,0,0,.24); padding:1px 5px; border-radius:4px; border:1px solid rgba(255,255,255,.14)}
:focus-visible{outline:none}
button:focus-visible, .chk:focus-within{
  box-shadow:0 0 0 3px var(--accent-soft); border-color:var(--accent-line);
}

/* 多选框（枚举参数） */
.checks{display:flex; flex-wrap:wrap; gap:8px}
.chk{
  display:inline-flex; align-items:center; gap:8px;
  padding:7px 12px; border-radius:999px;
  border:1px solid var(--border); background:var(--card-2);
  font-size:12.5px; color:var(--fg-dim); cursor:pointer; user-select:none;
  transition:border-color .15s var(--ease), color .15s, background .15s;
}
.chk:hover{border-color:var(--border-str); color:var(--fg)}
.chk input{appearance:none; width:15px; height:15px; margin:0; flex:none;
  border:1.5px solid var(--border-str); border-radius:5px; background:var(--sunk);
  position:relative; cursor:pointer; transition:background .15s, border-color .15s}
.chk input:checked{background:var(--accent); border-color:var(--accent)}
.chk input:checked::after{
  content:""; position:absolute; left:4px; top:1px; width:4px; height:8px;
  border:solid #04250f; border-width:0 2px 2px 0; transform:rotate(42deg);
}
.chk input:focus-visible{box-shadow:0 0 0 3px var(--accent-soft)}
.chk:has(input:checked){border-color:var(--accent-line); color:var(--fg); background:var(--accent-soft)}
.chk .tag{font-family:var(--mono); font-size:10.5px; color:var(--fg-mute)}
.chk:has(input:checked) .tag{color:var(--accent)}

/* 分段单选 */
.segmented{display:inline-flex; padding:3px; gap:3px; border-radius:999px;
  border:1px solid var(--border); background:var(--sunk); flex:none}
.segmented button{
  border:0; background:transparent; color:var(--fg-mute); font-size:12px;
  padding:4px 11px; border-radius:999px; font-family:var(--mono);
  transition:background .15s var(--ease), color .15s;
}
.segmented button[aria-pressed="true"]{background:var(--card-2); color:var(--fg); box-shadow:0 1px 4px rgba(0,0,0,.28)}

.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:9px}
.row.between{justify-content:space-between}
.grow{flex:1; min-width:0}

/* 问题卡片 */
.qlist{display:flex; flex-direction:column; gap:12px}
.qcard{
  border:1px solid var(--border); border-radius:var(--radius-sm);
  background:var(--card-2); padding:12px;
}
.qhead{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.qtype{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; text-transform:uppercase;
  padding:3px 8px; border-radius:6px; flex:none;
}
.qtype.choice{background:var(--info-soft); color:var(--info)}
.qtype.score{background:rgba(129,140,248,.14); color:var(--violet)}
.qtype.noul{background:var(--accent-soft); color:var(--accent)}
.qidinput{width:118px; flex:none}
.qbody{display:flex; flex-direction:column; gap:8px}
.sub{font-size:11.5px; color:var(--fg-mute); display:flex; align-items:center; gap:6px}
.critrow{display:flex; gap:7px; align-items:center}
.critrow .ord{
  font-family:var(--mono); font-size:11px; color:var(--fg-mute);
  width:20px; text-align:right; flex:none;
}
.critrow .k{flex:0 0 34%}
.critrow .v{flex:1; min-width:0}
.critrow .delrow{flex:none}
.err{color:var(--danger); font-size:12px; margin-top:6px; min-height:0}
.err:empty{display:none}
.note{
  font-size:11.5px; color:var(--fg-mute); border-left:2px solid var(--border-str);
  padding:2px 0 2px 9px; margin-top:2px;
}
.actions{display:flex; gap:10px; align-items:center; padding-top:6px; border-top:1px solid var(--border); margin-top:4px}

/* ============================== 结果区 ============================== */
.results{min-height:400px}
.empty{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; padding:64px 20px; color:var(--fg-mute); text-align:center;
}
.empty .big{font-family:var(--mono); font-size:26px; color:var(--border-str)}
.empty kbd{font-size:11px}

.rcard{
  border:1px solid var(--border); border-radius:var(--radius);
  background:var(--card-2); padding:15px; margin-bottom:14px;
}
.rhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px}
.rmodel{font-family:var(--mono); font-size:13px; font-weight:600}
.rmeta{font-family:var(--mono); font-size:11px; color:var(--fg-mute); display:flex; gap:12px; flex-wrap:wrap}
.ranswer{
  border:1px solid var(--border); border-radius:var(--radius-sm);
  background:var(--card); padding:12px; margin-top:11px;
}
.ahead{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:9px}
.aid{font-family:var(--mono); font-size:12px; font-weight:600}
.conf{
  font-family:var(--mono); font-size:10.5px; padding:2px 7px; border-radius:999px;
  border:1px solid var(--border-str); color:var(--fg-dim); margin-left:auto;
}
.conf.high{border-color:var(--accent-line); color:var(--accent); background:var(--accent-soft)}
.conf.mid{border-color:var(--warn); color:var(--warn); background:var(--warn-soft)}
.conf.low{border-color:var(--danger); color:var(--danger); background:var(--danger-soft)}

.noulval{display:flex; align-items:center; gap:14px}
.noulnum{font-family:var(--mono); font-size:30px; font-weight:600; line-height:1; letter-spacing:-.02em}
.noulval.yes .noulnum{color:var(--accent)}
.noulval.no .noulnum{color:var(--fg-dim)}
.verdict{font-size:12px; color:var(--fg-dim)}
.verdict b{color:var(--fg)}

.bar{height:7px; border-radius:999px; background:var(--sunk); overflow:hidden; position:relative; flex:1}
.bar > i{display:block; height:100%; border-radius:999px; background:var(--accent);
  transition:width .45s var(--ease)}
.bar.track::after{content:""; position:absolute; top:-2px; bottom:-2px; left:50%; width:1px;
  background:var(--border-str)}
.prow{display:flex; align-items:center; gap:10px; padding:3px 0}
.prow .pname{font-family:var(--mono); font-size:12px; flex:0 0 32%; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg-dim)}
.prow.win .pname{color:var(--fg); font-weight:600}
.prow .bar > i{background:var(--border-str)}
.prow.win .bar > i{background:var(--accent)}
.prow .pval{font-family:var(--mono); font-size:11.5px; color:var(--fg-mute); flex:0 0 52px; text-align:right}
.prow.win .pval{color:var(--accent)}

.ladder{display:flex; flex-direction:column-reverse; gap:3px}
.lrow{display:flex; align-items:center; gap:9px; padding:4px 8px; border-radius:7px;
  border:1px solid transparent; font-size:12px}
.lrow .lnum{font-family:var(--mono); font-size:11px; color:var(--fg-mute); width:18px; text-align:right; flex:none}
.lrow .ltext{flex:1; min-width:0; color:var(--fg-dim)}
.lrow .lp{font-family:var(--mono); font-size:11px; color:var(--fg-mute); flex:none}
.lrow.hit{border-color:var(--accent-line); background:var(--accent-soft)}
.lrow.hit .ltext{color:var(--fg)}
.lrow.hit .lnum{color:var(--accent)}
.scoreval{font-family:var(--mono); font-size:22px; font-weight:600; color:var(--violet)}

details{margin-top:11px}
summary{cursor:pointer; font-size:12px; color:var(--fg-mute); padding:3px 0}
summary:hover{color:var(--fg-dim)}
pre{
  font-family:var(--mono); font-size:11.5px; line-height:1.6; color:var(--fg-dim);
  background:var(--sunk); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:11px; overflow:auto; max-height:340px; margin:7px 0 0;
}
.rerr{border:1px solid var(--danger); background:var(--danger-soft); border-radius:var(--radius-sm);
  padding:11px; font-size:12.5px}
.rerr .kind{font-family:var(--mono); color:var(--danger); font-weight:600}

.cmp{width:100%; border-collapse:collapse; font-size:12px; margin-top:6px}
.cmp th,.cmp td{padding:6px 9px; text-align:left; border-bottom:1px solid var(--border)}
.cmp th{color:var(--fg-mute); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.05em}
.cmp td{font-family:var(--mono)}
.cmp td:first-child{font-family:var(--sans); color:var(--fg-dim)}
.cmp .same{color:var(--fg-dim)}
.cmp .diff{color:var(--warn)}

.hist{margin-top:18px; border-top:1px solid var(--border); padding-top:14px}
.hist h3{font-size:12px; color:var(--fg-mute); font-weight:500; margin:0 0 8px}
.hrow{display:flex; gap:10px; align-items:center; padding:5px 7px; border-radius:7px;
  font-size:12px; cursor:pointer; border:1px solid transparent}
.hrow:hover{border-color:var(--border); background:var(--card-2)}
.hrow .ht{font-family:var(--mono); font-size:11px; color:var(--fg-mute); flex:none}
.hrow .hs{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg-dim)}

.spin{display:inline-block; width:13px; height:13px; border-radius:50%;
  border:2px solid rgba(255,255,255,.28); border-top-color:var(--accent);
  animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>Jev Playground</h1>
    <span class="sub">TypeSafe · System One</span>
  </div>
  <div class="top-right">
    <span id="conn" class="pill">检查中…</span>
    <button id="themeBtn" class="ghost icon" title="切换明暗主题" aria-label="切换明暗主题">◐</button>
  </div>
</header>

<div id="banner" class="banner hidden"></div>

<main>
  <!-- ============================ 左：构造请求 ============================ -->
  <section class="panel builder">
    <form id="form" autocomplete="off">

      <fieldset>
        <legend>1 · 模型 <span class="hint">枚举 · 可多选，会并排对比</span></legend>
        <div id="models" class="checks"></div>
        <div class="err" id="modelsErr"></div>
      </fieldset>

      <fieldset>
        <legend>2 · State <span class="hint">要评估的材料，仅文本</span></legend>
        <div class="row between">
          <select id="preset" class="input sm grow"><option value="">载入预设场景…</option></select>
          <div id="stateModes" class="segmented" role="group" aria-label="state 形态"></div>
        </div>
        <textarea id="stateText" class="input mono" rows="6" spellcheck="false"
          placeholder="粘贴一条工单、一段文本，或一个 JSON 对象／数组…"></textarea>
        <div class="err" id="stateErr"></div>
      </fieldset>

      <fieldset>
        <legend>3 · 问题类型 <span class="hint">枚举 · 可多选；勾选即生成问题卡片</span></legend>
        <div id="types" class="checks"></div>
        <div id="questions" class="qlist" style="margin-top:12px"></div>
        <div class="row" style="margin-top:10px; margin-bottom:0">
          <span class="hint" id="qCount"></span>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" id="submit" class="primary">调用 Jev <kbd>⌘↵</kbd></button>
        <button type="button" id="clearBtn" class="ghost">清空</button>
        <span class="hint" id="estCost"></span>
      </div>
    </form>
  </section>

  <!-- ============================ 右：结果 ============================ -->
  <section class="panel results">
    <div id="out">
      <div class="empty">
        <div class="big">{ }</div>
        <div>左侧构造一个请求，然后按 <kbd>⌘</kbd>+<kbd>↵</kbd> 调用</div>
        <div class="hint">返回的是带类型的答案：choice 给选项与概率分布，score 给档位，noul 给 0~1 的概率</div>
      </div>
    </div>
    <div class="hist hidden" id="hist">
      <h3>最近调用</h3>
      <div id="histList"></div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
